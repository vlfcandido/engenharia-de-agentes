<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-labelledby="claro-agente-ferramentas-largo-t claro-agente-ferramentas-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="claro-agente-ferramentas-largo-t">Agente que usa ferramentas sem sair da linha</title><desc id="claro-agente-ferramentas-largo-d">O pedido passa por uma barreira que trata texto de fora como dado, nunca como instrução. O agente pensa, usa só as ferramentas liberadas e observa o resultado, num laço com limite de voltas. A saída é conferida contra um modelo tipado em Pydantic antes de virar resposta.</desc><defs><marker id="claro-agente-ferramentas-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#0d5f73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="claro-agente-ferramentas-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#e8445f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#f2f5f3"/><g aria-hidden="true"><path d="M770 570C770 486 848 456 902 462C962 468 1010 516 1010 570" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M808.4 570C808.4 512.88 861.44 492.48 898.16 496.56C938.96 500.64 971.6 533.28 971.6 570" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><path d="M844.4 570C844.4 538.08 874.04 526.68 894.56 528.96C917.36 531.24 935.6 549.48 935.6 570" fill="none" stroke="#bccdce" stroke-width="1.2" opacity="0.8"/><text x="884" y="556" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#486169" opacity="0.8">18</text></g><text x="46" y="39" font-family="'Brygada 1918', Georgi